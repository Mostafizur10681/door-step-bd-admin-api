name: Deploy Laravel Admin API

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Laravel Admin API to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || 22 }}

          script: |
            set -Eeuo pipefail

            DEPLOY_DIR="/var/www/admin.doorstepbd.org"

            echo "========================================="
            echo "🚀 Starting Laravel deployment"
            echo "📁 $DEPLOY_DIR"
            echo "========================================="

            cleanup() {
                EXIT_CODE=$?

                if [ "$EXIT_CODE" -ne 0 ]; then
                    echo ""
                    echo "❌ Deployment failed!"
                    echo "🔄 Bringing Laravel application back online..."

                    cd "$DEPLOY_DIR" 2>/dev/null || true
                    php artisan up 2>/dev/null || true

                    echo "❌ Deployment stopped with exit code: $EXIT_CODE"
                fi

                exit "$EXIT_CODE"
            }

            trap cleanup EXIT

            cd "$DEPLOY_DIR"

            echo "📍 Current directory:"
            pwd

            git config --global --add safe.directory "$DEPLOY_DIR" || true

            echo "📥 Fetching latest code..."

            git fetch origin main

            echo "🔄 Updating project to latest main..."

            git reset --hard origin/main

            echo "📌 Current commit:"
            git rev-parse --short HEAD

            if [ ! -f ".env" ]; then
                echo "❌ ERROR: .env file not found!"
                echo "Please create /var/www/admin.doorstepbd.org/.env"
                exit 1
            fi

            echo "✅ Production .env found"

            echo "📦 Installing Composer dependencies..."

            export COMPOSER_ALLOW_SUPERUSER=1

            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist

            echo "🔒 Enabling Laravel maintenance mode..."

            php artisan down \
              --render="errors::503" \
              --retry=60 \
              || true

            echo "📦 Installing Node dependencies..."

            npm ci --prefer-offline --no-audit || npm install

            echo "🎨 Building Vite assets..."

            npm run build

            echo "🗄️ Running database migrations..."

            php artisan migrate --force

            echo "🔗 Creating storage symlink..."

            php artisan storage:link || true

            echo "🧹 Clearing Laravel caches..."

            php artisan optimize:clear

            echo "⚡ Caching Laravel configuration..."

            php artisan config:cache

            echo "🛣️ Caching Laravel routes..."

            php artisan route:cache

            echo "👁️ Caching Laravel views..."

            php artisan view:cache

            echo "📡 Caching Laravel events..."

            php artisan event:cache || true

            echo "🛡️ Fixing Laravel permissions..."

            chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "🔄 Restarting Laravel queue workers..."

            php artisan queue:restart || true

            echo "🔄 Reloading PHP-FPM..."

            systemctl reload php8.2-fpm 2>/dev/null || systemctl reload php8.3-fpm 2>/dev/null || true

            echo "✨ Bringing Laravel application online..."

            php artisan up

            trap - EXIT

            echo ""
            echo "========================================="
            echo "✅ Deployment completed successfully!"
            echo "📌 Commit: $(git rev-parse --short HEAD)"
            echo "🌐 https://admin.doorstepbd.org"
            echo "========================================="
