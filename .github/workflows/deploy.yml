name: Deploy Admin & API to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            # Set target directory (fallback to default if secret is not set)
            TARGET_DIR="${{ secrets.DEPLOY_PATH || '/var/www/admin.doorstepbd.org' }}"

            echo "🚀 Starting deployment to $TARGET_DIR..."

            # Ensure target directory exists
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Directory $TARGET_DIR does not exist. Please clone the repository first."
              exit 1
            fi

            cd "$TARGET_DIR"

            # Verify manual .env exists on server
            if [ ! -f "$TARGET_DIR/.env" ]; then
              echo "⚠️ Warning: .env file not found in $TARGET_DIR! Please create your .env manually on the VPS."
            fi

            # Enable maintenance mode
            echo "⏸️ Enabling maintenance mode..."
            php artisan down --retry=60 || true

            # Pull latest changes from git
            echo "📥 Fetching latest code from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # Install/update Composer dependencies
            echo "📦 Installing PHP dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Install Node dependencies and compile production assets
            if [ -f "package.json" ]; then
              echo "🎨 Building frontend assets..."
              npm ci --prefer-offline --no-audit || npm install
              npm run build
            fi

            # Run database migrations
            echo "🗄️ Running database migrations..."
            php artisan migrate --force

            # Create storage symlink if not exists
            echo "🔗 Linking storage..."
            php artisan storage:link || true

            # Optimize and cache configuration, routes, and views
            echo "⚡ Optimizing Laravel caches..."
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Restart queue workers if supervisor / queue is running
            echo "🔄 Restarting queue workers..."
            php artisan queue:restart || true

            # Reload PHP-FPM if sudo permissions allow
            if command -v systemctl > /dev/null 2>&1; then
              echo "🔄 Reloading PHP-FPM..."
              sudo systemctl reload php8.2-fpm 2>/dev/null || sudo systemctl reload php8.3-fpm 2>/dev/null || sudo systemctl reload php-fpm 2>/dev/null || true
            fi

            # Disable maintenance mode
            echo "▶️ Disabling maintenance mode..."
            php artisan up

            echo "✅ Deployment completed successfully!"
